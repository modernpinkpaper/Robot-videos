  const lv = new THREE.Vector3(); hip.getWorldPosition(lv); lv.project(camera); const on = smooth((t - L(7).v0 - 1.2) / 0.3) * (1 - smooth((t - L(8).v1 + 0.2) / 0.3));
  const lb = $('lab'); lb.style.opacity = (on * (lv.z < 1 ? 1 : 0) * smooth((0.78 - Math.abs(lv.x)) / 0.2)).toFixed(3); lb.style.transform = `translate(${((lv.x * 0.5 + 0.5) * W - 100).toFixed(1)}px,${((-lv.y * 0.5 + 0.5) * H - 90).toFixed(1)}px)`;
  $('credit').style.opacity = clamp((t - (TOTAL - 4.2)) / 0.5).toFixed(3);
  $('fade').style.opacity = clamp((t - (TOTAL - 0.6)) / 0.5).toFixed(3);
};

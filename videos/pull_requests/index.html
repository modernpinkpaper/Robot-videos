html,body{margin:0;background:#1d1730;overflow:hidden}

#card .pill{font-size:28px;font-weight:bold;color:#fff;border-radius:22px;padding:6px 12px;text-align:left}
#cap{position:absolute;left:22px;right:22px;bottom:34px;padding:12px 18px 14px;border-radius:26px;background:rgba(29,23,48,.82);color:#fff;text-align:center;font-weight:bold;font-size:31px;line-height:1.22;opacity:0}
#cap .who{display:inline-block;font-size:17px;padding:2px 12px;border-radius:12px;margin-bottom:4px;color:#1d1730}
#flash{position:absolute;inset:0;background:#fff;opacity:0}

// ---------- timeline + camera plans ------------------------------------------------
const scs = TL.scenes; const sceneAt = t => { for (let i = scs.length - 1; i >= 0; i--) if (t >= scs[i].t0 - 1e-6) return i; return 0; };
const Lof = (sc, i) => (sc.lines[Math.min(i, sc.lines.length - 1)].v0 - sc.t0);
function charsAt(si, ts) { const sc = scs[si]; return S[si].chars(ts, i => Lof(sc, i)); }
function headOf(si, who, ts) { const c = charsAt(si, ts)[who] || charsAt(si, ts).MICA; const b = cast[who]; return [si * SW + c.x, 5.05 * b.g.scale.x + 0.5, c.z]; }
const plans = scs.map((sc, si) => {
  const cuts = []; 
  sc.lines.forEach((l, i) => { const d = l.v1 - l.v0, n = d > 5.6 ? 3 : d > 3.0 ? 2 : 1; for (let j = 0; j < n; j++) cuts.push({ t: j === 0 ? l.v0 - 0.12 : l.v0 + d * j / n, line: i, j, n }); });
  const FOC = S[si].focus; const cx = si * SW;
  // a "set" shot frames a whole illustration: f = [x,y,z,width]; d = distance so that the width fits the tall frame
  const setShot = (type, f, ci) => {
    const w = f[3] || 14, d = w * 2.7, fx = cx + f[0], fy = f[1], fz = f[2], ey = fy + d * 0.26, s = ci % 2 ? 1 : -1, c = [fx, fy, fz];
    if (type === 'orbit') return { orbit: { c, r: [d * 1.05, d * 0.92], a: [s * 38, s * 6], h: [ey, ey - 1.5] }, l: [c, c], f: [40, 38], ease: 'io' };
    if (type === 'dolly') return { p: [[fx - 0.45 * w * s, ey, fz + d], [fx + 0.45 * w * s, ey + 1, fz + d * 0.94]], l: [[fx - 0.08 * w * s, fy, fz], [fx + 0.08 * w * s, fy, fz]], f: [40, 38], ease: 'io' };
    if (type === 'pan') return { p: [[fx, ey, fz + d * 1.02], [fx + 1.5 * s, ey - 0.4, fz + d]], l: [[fx - 0.28 * w * s, fy, fz], [fx + 0.28 * w * s, fy, fz]], f: [40, 34], ease: 'io' };
    if (type === 'crane') return { p: [[fx, fy + 1.5, fz + d * 0.85], [fx + 0.1 * w * s, fy + d * 0.62, fz + d * 1.25]], l: [c, [fx, fy - 1, fz - 1]], f: [38, 44], ease: 'io' };
    if (type === 'low') return { p: [[fx - 0.2 * w * s, 1.6, fz + d * 0.95], [fx - 0.3 * w * s, 3.2, fz + d * 0.82]], l: [[fx, fy + 1, fz], [fx, fy + 1.5, fz]], f: [38, 34], r: [3 * s, -1], ease: 'io' };
    return { p: [[fx + 0.18 * w * s, ey + 2, fz + d * 1.2], [fx + 0.04 * w * s, ey, fz + d * 0.96]], l: [c, c], f: [38, 32], ease: 'io' };   // push in
  };
  const SET = ['push', 'orbit', 'dolly', 'pan', 'crane', 'low'], SPK = ['pushIn', 'closeUp', 'lowAngle', 'zoomLens', 'closeUp'];
  const shots = [{ t: sc.t0, name: si === 0 ? 'aerial' : 'wide', cam: si === 0 ? SHOTS.aerial([cx, 0, -2]) : (si % 2 ? SHOTS.crane([cx, 5, 0], 22, 40, 20) : SHOTS.wide([cx, 6, -2], 44)) }];
  let prevKind = 'spk', nSet = 0, nSpk = 0;
  cuts.forEach((c, ci) => {
    const l = sc.lines[c.line], t0 = c.t, t1 = ci + 1 < cuts.length ? cuts[ci + 1].t : sc.t1;
    // MICA's teaching lines show the picture first; questions and reactions show the face first. Then we alternate.
    let kind = c.j === 0 ? (l.who === 'MICA' || l.card ? 'set' : 'spk') : (prevKind === 'set' ? 'spk' : 'set');
    if (c.j > 0 && l.who === 'MICA' && c.line % 2 === 0 && si < 11) kind = 'set';
    if (c.j === 0 && prevKind === kind && !(l.card && l.card.k !== 'term') && !(l.who === 'MICA' && c.line % 2 === 1 && si < 11)) kind = kind === 'set' ? 'spk' : 'set';
    prevKind = kind; let cam, name;
    if (kind === 'spk') { const type = SPK[nSpk++ % SPK.length], who = l.who; name = type; const a = headOf(si, who, t0 - sc.t0), b = headOf(si, who, t1 - sc.t0);
      const s0 = SHOTS[type](a, ...(type === 'closeUp' ? [17, { roll: (nSpk % 2 ? 2.5 : -2.5) }] : [])), s1 = SHOTS[type](b, ...(type === 'closeUp' ? [17, { roll: 0 }] : []));
      cam = Object.assign({}, s0, { p: [s0.p[0], s1.p[1]], l: [s0.l[0], s1.l[1]] }); if (type !== 'lowAngle') cam.shake = 0.025; }
    else { const type = SET[(nSet++ + si) % SET.length]; name = type; cam = setShot(type, FOC(c.line, c.j), ci); if (type !== 'low') cam.shake = 0.02; }
    shots.push({ t: t0, name, cam });
  });
  return { end: sc.t1, shots };
});
// special moments
{ // once per video: dolly zoom on YOU in the recap ("I get it now!")
  const si = 11, sc = scs[si], p = plans[si], l = sc.lines[4]; const k = p.shots.findIndex(s => s.t >= l.v0 - 0.2); if (k > 0) p.shots[k].cam = SHOTS.dollyZoom(headOf(si, 'YOU', l.v0 - sc.t0), 17, 40);
  // the ending: pull back
  const lf = sc.lines[5]; p.shots = p.shots.filter(s => s.t < lf.v0 - 0.3); p.shots.push({ t: lf.v0 - 0.15, name: 'pullBack', cam: { p: [[si * SW - 2, 5.2, 22], [si * SW, 17, 100]], l: [[si * SW, 5.2, 3], [si * SW, 11, -4]], f: [34, 48], ease: 'io' } });
}
const CUTS = scs.slice(0, -1).map(s => s.t1);

// ---------- on-screen words ------------------------------------------------------
const el = id => document.getElementById(id), card = el('card'), cap = el('cap'), flash = el('flash'), track = el('track');
const STEPS = ['Repo', 'Commit', 'Branch', 'Pull request', 'Merge']; track.innerHTML = STEPS.map(s => `<div class="chip">${s}</div>`).join(''); const chips = [...track.children];
const PILL = ['#8a62e0', '#2fb8a8', '#e8689a', '#f09a10', '#3fb145'];
let lastCardKey = '';
function drawUI(t, si) {
  const sc = scs[si]; chips.forEach((c, i) => { c.className = 'chip' + (sc.step === 5 ? ' done' : (sc.step === i ? ' on' : (sc.step > i ? ' done' : ''))); }); track.style.opacity = sc.step === -1 ? 0.0 : 1;
  // card
  let showing = null, cs = 0, ce = 0;
  sc.lines.forEach((l, i) => { if (!l.card) return; const nx = sc.lines.slice(i + 1).find(q => q.card); const s = l.v0 - 0.05, e = Math.min(l.v1 + (l.card.hold ?? 1.2), nx ? nx.v0 - 0.05 : 1e9, sc.t1 - 0.05); if (t >= s && t < e) { showing = l.card; cs = s; ce = e; } });
  if (showing) {
    const key = showing.k + showing.t + showing.s; if (key !== lastCardKey) { lastCardKey = key; card.className = showing.k === 'do' ? 'do' : showing.k === 'dont' ? 'dont' : '';
      card.innerHTML = showing.k === 'chips' ? `<div class="big" style="font-size:34px;margin-bottom:8px">Five words to learn</div><div class="pills">${STEPS.map((s, i) => `<div class="pill" style="background:${PILL[i]}" data-i="${i}">${i + 1}  ${s}</div>`).join('')}</div>`
        : (showing.k === 'term' ? `<div class="big">${showing.t}</div><div class="sub">${showing.s}</div>` : `<div class="row"><div class="dot">${showing.k === 'do' ? '✓' : '✕'}</div><div class="big">${showing.t}</div></div><div class="sub">${showing.s}</div>`); }
    const u = clamp((t - cs) / 0.3), o = clamp((ce - t) / 0.2), sc2 = (1 + 1.7 * Math.pow(u - 1, 3) + 0.7 * Math.pow(u - 1, 2)); card.style.opacity = Math.min(u * 3, o); card.style.transform = `scale(${Math.max(0.01, sc2) * (0.94 + 0.06 * o)})`;
    if (showing.k === 'chips') card.querySelectorAll('.pill').forEach((p, i) => { const q = clamp((t - cs - 0.35 - i * 0.28) / 0.25); p.style.opacity = q; p.style.transform = `translateX(${(1 - q) * 40}px)`; });
  } else { card.style.opacity = 0; lastCardKey = ''; }
  // caption
  let line = null; sc.lines.forEach(l => { if (t >= l.v0 - 0.05 && t < l.v1 + 0.45) line = l; });
  if (line) { cap.innerHTML = `<div class="who" style="background:${CCOL[line.who]}">${NAMEOF[line.who]}</div><br>${line.text}`; cap.style.opacity = Math.min(1, clamp((t - line.v0 + 0.05) / 0.15), clamp((line.v1 + 0.45 - t) / 0.2)); } else cap.style.opacity = 0;
}

// ---------- the frame function -------------------------------------------------------
window.renderFrame = t => {
  const si = sceneAt(t), sc = scs[si], ts = t - sc.t0, st = S[si]; const L = i => Lof(sc, i), D = i => sc.lines[i].v1 - sc.t0;
  S.forEach((s, i) => s.g.visible = i === si);
  const cx = si * SW; sun.position.set(cx - 6, 16, 14); sun.target.position.set(cx, 5, 0); pk.position.set(cx - 9, 10, 4); bl.position.set(cx + 9, 10, 4);
  // who is talking
  let cur = null, last = null; sc.lines.forEach(l => { if (t >= l.v0 - 0.02) last = l; if (t >= l.v0 && t <= l.v1 + 0.05) cur = l; });
  const pos = st.chars(ts, L);
  for (const who of Object.keys(cast)) { const b = cast[who], p = pos[who]; if (!p) { b.g.visible = false; continue; } b.g.visible = true; b.g.position.set(cx + p.x, 0, p.z); b.g.rotation.y = p.ry || 0;
    const sp = cur && cur.who === who; const amp = sp ? (cur.env[Math.max(0, Math.min(cur.env.length - 1, Math.floor((t - cur.e0) * 48)))] || 0) : 0;
    let emo = 'neutral'; if (sp) emo = cur.emo; else if (last && last.who === who && t - last.v1 < 1.0) emo = last.emo; else if (last) emo = last.emo === 'worried' ? 'sweet' : (last.emo === 'stern' ? 'neutral' : 'happy');
    const other = last ? pos[last.who] : null; const look = other ? [clamp((other.x - p.x) / 8, -1, 1) * 0.8, 0.1] : null;
    animateBot(b, t, { speaking: !!sp, amp, emo, look: look || undefined, wave: !!p.wave, walk: !!p.walk, sit: !!p.sit }); }
  st.update(ts, t, L, D);
  // camera
  const pl = plans[si]; const sh = shotAt(pl, t); const shot = pl.shots[sh.i];
  const wp = whipPan(t, CUTS); const c = evalCam(shot.cam, sh.u, t, shot.t, si === 0 && sh.i === 0);
  applyCam(camera, c, W / H, wp.yaw); renderer.domElement.style.filter = wp.blur > 0.4 ? `blur(${wp.blur.toFixed(1)}px)` : 'none';
  renderer.render(scene, camera);
  flash.style.opacity = wp.flash; drawUI(t, si);
};
window.dbg = () => ({ pos: camera.position.toArray(), fov: camera.fov, plan: plans.map(p => p.shots.map(x => [x.name, +x.t.toFixed(1)])), mica: cast.MICA.g.position.toArray(), you: cast.YOU.g.position.toArray() }); window.TL = TL; window.renderFrame(0.5); window.ready = true;

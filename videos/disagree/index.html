{ const c = sun.shadow.camera; c.left = -16; c.right = 16; c.top = 20; c.bottom = -6; c.near = 1; c.far = 60; } sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03; scene.add(sun, sun.target);

for (let i = 0; i < 5; i++) B(room, 1.1, 3.8 + (i % 2), 0.5, [0x3a3350, 0xffb3d1, 0xcfe8ff, 0x3a3350, 0xe2d4ff][i], -6 + i * 1.2, 7.6 - (i % 2) * 0.4, -6, 0.25);

  const tot = out.reduce((a, c) => a + c.length + 2, 0); let acc = 0; return out.map(c => { const a = l.v0 + (l.v1 - l.v0) * acc / tot; acc += c.length + 2; return { a, b: l.v0 + (l.v1 - l.v0) * acc / tot, c }; }); });

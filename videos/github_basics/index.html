<style>
html,body{margin:0;background:#1d1730;overflow:hidden}
#stage{position:relative;width:576px;height:1024px;overflow:hidden}
canvas{display:block}
#ui{position:absolute;left:0;top:0;width:576px;height:1024px;pointer-events:none;font-family:'Liberation Sans','DejaVu Sans',Arial,sans-serif}
#track{position:absolute;top:14px;left:0;width:576px;display:flex;justify-content:center;gap:6px}
.chip{font-weight:bold;font-size:14px;padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.55);color:#6d6585;border:2px solid transparent}
.chip.on{background:#fff;color:#5b3fc0;border-color:#8a62e0;transform:scale(1.12)}
.chip.done{background:#d9f5df;color:#2d8b3a}
#card{position:absolute;left:44px;top:62px;width:488px;box-sizing:border-box;padding:16px 22px 18px;border-radius:30px;text-align:center;border:6px solid #8a62e0;background:#fff;box-shadow:0 8px 0 rgba(60,40,110,.25);transform-origin:50% 0;opacity:0}
#card .big{font-size:50px;font-weight:bold;line-height:1.1;color:#5b3fc0}
#card .sub{font-size:27px;font-weight:bold;color:#4a4560;margin-top:6px;line-height:1.2}
#card.do{background:#e6f9ea;border-color:#3fb145}#card.do .big{color:#2d8b3a}
#card.dont{background:#ffe6ec;border-color:#e8506a}#card.dont .big{color:#d23a56}
#card .row{display:flex;align-items:center;justify-content:center;gap:14px}
#card .dot{width:54px;height:54px;border-radius:27px;color:#fff;font-size:36px;line-height:54px;font-weight:bold}
#card.do .dot{background:#3fb145}#card.dont .dot{background:#e8506a}
#card .pills{display:flex;flex-direction:column;gap:7px;align-items:stretch}
#card .pill{font-size:28px;font-weight:bold;color:#fff;border-radius:22px;padding:6px 12px;text-align:left}
#cap{position:absolute;left:22px;right:22px;bottom:34px;padding:12px 18px 14px;border-radius:26px;background:rgba(29,23,48,.82);color:#fff;text-align:center;font-weight:bold;font-size:31px;line-height:1.22;opacity:0}
#cap .who{display:inline-block;font-size:17px;padding:2px 12px;border-radius:12px;margin-bottom:4px;color:#1d1730}
#flash{position:absolute;inset:0;background:#fff;opacity:0}

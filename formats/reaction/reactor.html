<!doctype html><html><head><meta charset="utf-8"><title>Reactor</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}#wrap{position:relative;width:576px;height:1024px}
#cap{position:absolute;left:28px;right:28px;top:498px;text-align:center;display:flex;justify-content:center}
#cap span{display:inline-block;background:#fff;color:#14101f;font:800 30px/1.15 Liberation Sans,Arial,sans-serif;padding:9px 16px 10px;border-radius:12px;max-width:520px;box-shadow:0 4px 14px rgba(40,20,80,.28);text-transform:uppercase;letter-spacing:.2px}
#cap em{font-style:normal;color:#2236d8}#cap[hidden]{display:none}</style></head><body>
<div id="wrap"><div id="cap" hidden><span id="capt"></span></div></div>
<script type="importmap">{"imports":{"three":"../../characters/three.module.js"}}</script>
<script type="module">
// THE REACTOR: a character in the top right, watching a clip at the bottom left, reacting (and talking). Transparent background.
import * as THREE from 'three';
import { RoundedBoxGeometry } from '../../characters/RoundedBoxGeometry.js';
import { createRobotKit } from '../../characters/robots.js';
const Q = new URLSearchParams(location.search), W = 576, H = 1024;
const D = await (await fetch(Q.get('json') || 'work/reaction.json')).json();
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.getElementById('wrap').prepend(renderer.domElement);
const scene = new THREE.Scene(); const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xfff0ff, 0xb59fd8, 1.1));
const sun = new THREE.DirectionalLight(0xfff2e6, 1.7); sun.position.set(-6, 14, 14); sun.target.position.set(0, 4, 0); scene.add(sun, sun.target);
const pk = new THREE.PointLight(0xff8fc8, 26, 40, 2); pk.position.set(-9, 8, 6); scene.add(pk); const bl = new THREE.PointLight(0x8fb8ff, 26, 40, 2); bl.position.set(9, 8, 6); scene.add(bl);
const kit = createRobotKit(THREE, RoundedBoxGeometry);
const who = (D.reactor.who || 'dalia'); const P = kit.PEOPLE.find(p => p.name === who.toLowerCase());
const bot = P ? kit.mkHuman(Object.assign({}, P, { parent: scene, legs: false })) : kit.mkBot(who.toUpperCase(), { parent: scene, legs: false }); bot.idx = 3;
// Framing: head and shoulders large, pushed to the top right of the 9:16 frame (set in work/reaction.json "frame" to adjust)
const F = Object.assign({ pos: [0, 5.4, 22], look: [0, 4.4, 0], fov: 30, offx: -100, offy: 10 }, D.frame || {});
camera.fov = F.fov; camera.position.set(...F.pos); camera.lookAt(...F.look); camera.setViewOffset(W, H, F.offx, F.offy, W, H); camera.updateProjectionMatrix();
const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), sm = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const cap = document.getElementById('cap'), capt = document.getElementById('capt');
let wasTalk = 0;
function envAt(b, t) { const k = (t - b.start) * 48, i = Math.floor(k); if (i < 0 || i >= b.env.length - 1) return 0; return lerp(b.env[i], b.env[i + 1], k - i); }
window.renderFrame = t => {
  const talk = D.talks.find(b => t >= b.v0 && t <= b.v1 + 0.05), react = D.reacts.find(r => t >= r.t0 && t <= r.t1);
  // 0 = watching the clip (bottom left), 1 = talking to the viewer; blends smoothly
  const target = talk ? 1 : 0; wasTalk = target; const near = D.talks.reduce((m, b) => Math.min(m, t >= b.v0 - 0.25 && t <= b.v1 + 0.45 ? 0 : 9), 9);
  let toCam = 0; for (const b of D.talks) { const a = sm((t - (b.v0 - 0.25)) / 0.25), z = 1 - sm((t - (b.v1 + 0.2)) / 0.3); toCam = Math.max(toCam, Math.min(a, z)); }
  const emo = talk ? talk.emo : (react ? react.emo : 'neutral'); const amp = talk ? envAt(talk, t) : 0;
  kit.animateBot(bot, t, { speaking: !!talk, amp, emo, look: [lerp(-0.9, 0, toCam), lerp(0.7, 0, toCam)] });
  bot.body.position.z = 0; const w = 1 - toCam;                                   // watching weight
  bot.head.rotation.y += -0.5 * w; bot.head.rotation.x += 0.17 * w; bot.g.rotation.y = -0.22 * w;
  bot.head.rotation.z += Math.sin(t * 0.9) * 0.012;
  if (react) {
    const u = (t - react.t0) / Math.max(0.1, react.t1 - react.t0), e = Math.sin(clamp(u) * Math.PI);
    if (react.act === 'nod') bot.head.rotation.x += Math.sin(t * 9) * 0.12 * e;
    if (react.act === 'shake') bot.head.rotation.y += Math.sin(t * 11) * 0.18 * e;
    if (react.act === 'gasp') { bot.body.position.z = -0.5 * e; bot.head.rotation.x -= 0.1 * e; bot.arms.forEach((a, i) => { a.rotation.x = -1.2 * e; a.rotation.z = (i ? -0.5 : 0.5) * e; }); }
    if (react.act === 'laugh') { bot.body.position.y += Math.abs(Math.sin(t * 16)) * 0.1 * e; bot.head.rotation.x -= 0.12 * e; bot.head.rotation.z += Math.sin(t * 18) * 0.05 * e; }
    if (react.act === 'facepalm') { bot.arms[1].rotation.x = -2.5 * e; bot.arms[1].rotation.z = -0.5 * e; bot.head.rotation.x += 0.25 * e; }
    if (react.act === 'lean') { bot.body.position.z = 0.5 * e; bot.head.rotation.y -= 0.1 * e; }
    if (react.act === 'hop') bot.body.position.y += Math.abs(Math.sin(u * Math.PI * 2)) * 0.35 * e;
  }
  const c = D.caps.find(c => t >= c.t0 && t <= c.t1);
  if (c) { cap.hidden = false; capt.innerHTML = c.text.replace(/\*([^*]+)\*/g, '<em>$1</em>'); } else cap.hidden = true;
  renderer.render(scene, camera);
};
window.renderFrame(0); window.ready = true;
</script></body></html>
